  <style>
    :root { --bg: #050505; --txt: #f0efeb; --muted: #777; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--txt);
      font-family: 'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300;

    }
    a { color: inherit; }

    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .1;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0, rgba(255,255,255,.03) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: screen; animation: grain 2.5s steps(4) infinite;
    }
    @keyframes grain { 25% { transform: translate(-3px,-4px); } 50% { transform: translate(2px,3px); } 75% { transform: translate(-2px,2px); } }

    header { display: flex; justify-content: space-between; align-items: center; }
    header .name { font-weight: 500; font-size: .85rem; letter-spacing: .04em; text-decoration: none; }
    header .back { font-size: .78rem; letter-spacing: .06em; color: #888; text-decoration: none; transition: color .2s; }
    header .back:hover { color: var(--txt); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 0; }

    .frame {
      position: relative; width: min(46rem, 86vw); aspect-ratio: 2.39 / 1;
      border: 1px dashed rgba(240,239,235,.35); display: grid; place-items: center;
    }
    .frame i { position: absolute; width: 14px; height: 14px; border-color: var(--txt); border-style: solid; }
    .frame i:nth-of-type(1) { left: -9px; top: -9px; border-width: 1px 0 0 1px; }
    .frame i:nth-of-type(2) { right: -9px; top: -9px; border-width: 1px 1px 0 0; }
    .frame i:nth-of-type(3) { left: -9px; bottom: -9px; border-width: 0 0 1px 1px; }
    .frame i:nth-of-type(4) { right: -9px; bottom: -9px; border-width: 0 1px 1px 0; }
    .frame .lbl { position: absolute; top: -1.7rem; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .frame .lbl.l { left: 0; }
    .frame .lbl.r { right: 0; animation: blink 1.2s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .frame .code { font-size: clamp(3rem, 12vw, 7rem); font-weight: 300; letter-spacing: -.04em; line-height: 1; color: #2a2a2a; }

    h1 { font-weight: 400; font-size: clamp(1.15rem, 2vw, 1.5rem); letter-spacing: -.01em; margin-top: 3rem; }
    p { margin-top: .6rem; font-size: 1rem; line-height: 1.55; color: #bdbbb5; max-width: 34rem; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem 1.8rem; margin-top: 2rem; }
    .links a { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; }
    .links a:hover { color: var(--txt); }
    .links a.main { color: var(--txt); border-bottom: 1px solid #444; padding-bottom: 2px; }

    footer { font-size: .75rem; letter-spacing: .04em; color: #444; }

    @media (prefers-reduced-motion: reduce) {
      body::before, .frame .lbl.r { animation: none; }
    }
  </style>
